<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAZZ 시세판</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --border: #30363d;
      --text-muted: #7d8590;
      --c1: #3fb950;
      --c2: #58a6ff;
    }
    html, body { height:100%; overflow:hidden; }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
    }
    .ticker-wrap { flex-shrink:0; background:#000; border-bottom:1px solid var(--border); }
    .ticker-wrap > * { background:#000 !important; }

    .tab-bar {
      flex-shrink:0; display:flex; align-items:stretch;
      background:var(--bg-card); border-bottom:1px solid var(--border);
      height:32px; padding:0 6px; gap:2px;
    }
    .tab-btn {
      display:flex; align-items:center; gap:5px; padding:0 12px;
      font-size:12px; font-weight:700; color:var(--text-muted);
      background:none; border:none; border-bottom:2px solid transparent;
      margin-bottom:-1px; cursor:pointer;
      transition:color 0.15s, background 0.15s, border-color 0.15s;
      border-radius:3px 3px 0 0; white-space:nowrap;
    }
    .tab-btn:hover { background:rgba(255,255,255,0.04); color:#e6edf3; }
    .tab-num {
      font-size:9px; font-weight:700; padding:1px 4px; border-radius:3px;
      background:rgba(255,255,255,0.08); color:var(--text-muted);
    }
    #btn-kr.on { color:var(--c1); border-bottom-color:var(--c1); background:rgba(63,185,80,0.07); }
    #btn-kr.on .tab-num { background:rgba(63,185,80,0.2); color:var(--c1); }
    #btn-us.on { color:var(--c2); border-bottom-color:var(--c2); background:rgba(88,166,255,0.07); }
    #btn-us.on .tab-num { background:rgba(88,166,255,0.2); color:var(--c2); }

    .sub-tab-bar {
      display:none; flex-shrink:0; background:var(--bg);
      border-bottom:1px solid var(--border); height:28px; padding:0 6px;
    }
    .sub-tab-btn {
      display:inline-flex; align-items:center; padding:0 14px; height:100%;
      font-size:11px; font-weight:600; color:var(--text-muted);
      background:none; border:none; border-bottom:2px solid transparent;
      margin-bottom:-1px; cursor:pointer;
    }
    .sub-tab-btn.on { color:var(--c1); border-bottom-color:var(--c1); }

    .tab-spacer { flex:1; }
    #clock {
      display:flex; align-items:center; font-size:10px; color:var(--text-muted);
      font-variant-numeric:tabular-nums; padding-right:4px;
    }

    .tab-panel { display:none; flex:1; min-height:0; }
    .tab-panel.on { display:flex; }

    .heatmap-area { flex:1; display:flex; min-height:0; }
    .heatmap-panel {
      flex:1; min-width:0; display:flex; flex-direction:column;
      border-right:1px solid var(--border);
    }
    .heatmap-panel:last-child { border-right:none; }
    .heatmap-inner { flex:1; min-height:0; position:relative; overflow:hidden; }
    .finviz-link {
      position: absolute;
      top: 8px; right: 12px;
      z-index: 10;
      background: rgba(13,17,23,0.85);
      color: #58a6ff;
      font-size: 11px; font-weight: 600;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      text-decoration: none;
      backdrop-filter: blur(2px);
    }
    .finviz-link:hover { background: rgba(13,17,23,1); color:#79c0ff; }

    .heatmap-inner iframe {
      position:absolute;
      border:none; display:block;
      /* 기본(PC, 1024px 초과): 자르기 없음 */
      top:0; left:0; width:100%; height:100%;
    }

    /* 769px 이상(태블릿+PC): Prober 자체 헤더
       (제목/검색창/로고/메뉴줄)만큼 위쪽을 잘라낸다.
       KOSPI/KOSDAQ 버튼 줄은 남기고 그 위쪽만 자른다.
       .no-crop(US 탭, TradingView 위젯)은 자체 헤더가 없어 제외 */
    @media (min-width:769px) {
      .heatmap-inner:not(.no-crop) iframe {
        width:100%;
        height: calc(100% + 100px);
        top: -100px;
        left: 0;
      }
    }

    @media (max-width:768px) {
      .ticker-wrap { display:none; }
      .sub-tab-bar { display:flex; }
      .tab-bar { height:30px; }
      #panel-kr .heatmap-area, #panel-us .heatmap-area { position:relative; }
      #panel-kr .heatmap-panel, #panel-us .heatmap-panel {
        position:absolute; inset:0; display:none; border:none;
      }
      #panel-kr .heatmap-panel.active, #panel-us .heatmap-panel.active { display:flex; }
      /* 모바일도 같은 방식으로 헤더 자르기 적용 (US 위젯은 제외) */
      .heatmap-inner:not(.no-crop) iframe {
        width:100%;
        height: calc(100% + 130px);
        top: -130px;
        left: 0;
      }
    }
  </style>
</head>
<body>

<div class="ticker-wrap">
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"></script>
  <tv-ticker-tape color-theme="dark"
    symbols="FOREXCOM:SPXUSD,CAPITALCOM:NAS100,CAPITALCOM:US30,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,TVC:GOLD,TVC:SILVER,BLACKBULL:WTI,TVC:VIX,FX_IDC:USDKRW">
  </tv-ticker-tape>
</div>

<div class="tab-bar">
  <button class="tab-btn on" id="btn-kr" onclick="showMain('kr')">
    <span class="tab-num">01</span> KR
  </button>
  <button class="tab-btn" id="btn-us" onclick="showMain('us')">
    <span class="tab-num">02</span> US
  </button>
  <div class="tab-spacer"></div>
  <div id="clock"></div>
</div>

<div class="sub-tab-bar" id="sub-tab-bar"></div>

<!-- KR 탭 -->
<div class="tab-panel on" id="panel-kr">
  <div class="heatmap-area">
    <div class="heatmap-panel active" id="panel-kospi">
      <div class="heatmap-inner">
        <iframe id="iframe-kospi" src="https://prober.kr/product/heatmap/stockKor" scrolling="yes"></iframe>
      </div>
    </div>
    <div class="heatmap-panel" id="panel-kosdaq">
      <div class="heatmap-inner">
        <iframe id="iframe-kosdaq" src="https://prober.kr/product/heatmap/stockKor" scrolling="yes"></iframe>
      </div>
    </div>
  </div>
</div>

<!-- US 탭 -->
<div class="tab-panel" id="panel-us">
  <div class="heatmap-area">
    <div class="heatmap-panel active" id="panel-spx">
      <div class="heatmap-inner">
        <a href="https://kr.tradingview.com/heatmap/stock/#%7B%22dataSource%22%3A%22SPX500%22%2C%22blockColor%22%3A%22change%22%2C%22blockSize%22%3A%22market_cap_basic%22%2C%22grouping%22%3A%22sector%22%7D" target="_blank" rel="noopener noreferrer" class="finviz-link">
          TradingView 실시간 보기 ↗
        </a>
        <iframe id="iframe-spx" src="https://prober.kr/product/heatmap/stockUs" scrolling="yes"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
  const isMobile = () => window.innerWidth <= 768;

  const SUB_TABS = {
    kr: [
      { id:'kospi',  label:'KOSPI'    },
      { id:'kosdaq', label:'KOSDAQ'   }
    ]
    /* US는 prober.kr 단일 화면이라 서브탭 없음 */
  };

  function renderSubTabs(mainId) {
    const bar = document.getElementById('sub-tab-bar');
    bar.innerHTML = '';
    SUB_TABS[mainId].forEach((t,i) => {
      const btn = document.createElement('button');
      btn.className = 'sub-tab-btn' + (i===0 ? ' on' : '');
      btn.id = 'sub-'+t.id;
      btn.textContent = t.label;
      btn.onclick = () => showSub(mainId, t.id);
      bar.appendChild(btn);
    });
  }

  function showMain(id) {
    ['kr','us'].forEach(i => {
      document.getElementById('panel-'+i).classList.toggle('on', i===id);
      document.getElementById('btn-'+i).classList.toggle('on', i===id);
    });
    if (isMobile() && id === 'kr') {
      renderSubTabs(id);
      document.getElementById('sub-tab-bar').style.display = 'flex';
    } else {
      document.getElementById('sub-tab-bar').style.display = 'none';
    }
    setHeight();
  }

  function showSub(mainId, subId) {
    SUB_TABS[mainId].forEach(t => {
      document.getElementById('panel-'+t.id).classList.toggle('active', t.id===subId);
      document.getElementById('sub-'+t.id).classList.toggle('on', t.id===subId);
    });
  }

  /* KOSDAQ/NASDAQ100 패널 iframe에 자동으로 해당 버튼 클릭 시도
     — cross-origin이라 대부분 실패하지만, 같은 도메인이거나
     정책이 허용되는 경우를 위해 시도는 해둔다. 실패해도 무해함. */
  function tryAutoSelect(iframeId, label) {
    const iframe = document.getElementById(iframeId);
    iframe.addEventListener('load', function() {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const candidates = doc.querySelectorAll('button, [role="tab"], a, div');
        candidates.forEach(el => {
          if (el.textContent && el.textContent.trim() === label) {
            el.click();
          }
        });
      } catch(e) {
        /* cross-origin 차단 시 조용히 무시 */
      }
    });
  }
  tryAutoSelect('iframe-kosdaq', 'KOSDAQ');

  function tick() {
    const opts = {timeZone:'Asia/Seoul',hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit'};
    document.getElementById('clock').textContent =
      new Date().toLocaleString('ko-KR',opts)+' KST';
  }
  tick(); setInterval(tick,1000);

  function setHeight() {
    const ticker = document.querySelector('.ticker-wrap');
    const tabBar = document.querySelector('.tab-bar');
    const subBar = document.getElementById('sub-tab-bar');
    const tickerH = (ticker && getComputedStyle(ticker).display!=='none') ? ticker.offsetHeight : 0;
    const tabH = tabBar.offsetHeight;
    const subH = (subBar.style.display==='flex') ? subBar.offsetHeight : 0;
    const h = Math.max(window.innerHeight - tickerH - tabH - subH, 200) + 'px';
    document.querySelectorAll('.tab-panel,.heatmap-area').forEach(el=>el.style.height=h);
  }
  setHeight();

  window.addEventListener('resize', () => {
    const mainId = document.getElementById('panel-kr').classList.contains('on') ? 'kr' : 'us';
    if (isMobile() && mainId === 'kr') {
      renderSubTabs(mainId);
      document.getElementById('sub-tab-bar').style.display = 'flex';
    } else {
      document.getElementById('sub-tab-bar').style.display = 'none';
    }
    setHeight();
  });
</script>
</body>
</html>
