<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAZZ 시세판</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --border: #30363d;
      --text-muted: #7d8590;
      --c1: #3fb950;
      --c2: #58a6ff;
    }
    html, body { height:100%; overflow:hidden; }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ① 티커 — 배경 검정 강제 */
    .ticker-wrap {
      flex-shrink: 0;
      background: #000;
      border-bottom: 1px solid var(--border);
    }
    .ticker-wrap > * { background: #000 !important; }

    /* 탭 바 */
    .tab-bar {
      flex-shrink:0; display:flex; align-items:stretch;
      background:var(--bg-card); border-bottom:2px solid var(--border);
      height:46px; padding:0 8px; gap:2px;
    }
    .tab-btn {
      display:flex; align-items:center; gap:7px; padding:0 18px;
      font-size:13px; font-weight:700; color:var(--text-muted);
      background:none; border:none; border-bottom:3px solid transparent;
      margin-bottom:-2px; cursor:pointer;
      transition:color 0.15s, background 0.15s, border-color 0.15s;
      border-radius:4px 4px 0 0; white-space:nowrap;
    }
    .tab-btn:hover { background:rgba(255,255,255,0.04); color:#e6edf3; }
    .tab-num {
      font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;
      background:rgba(255,255,255,0.08); color:var(--text-muted);
      transition:background 0.15s, color 0.15s;
    }
    #btn-1.on { color:var(--c1); border-bottom-color:var(--c1); background:rgba(63,185,80,0.07); }
    #btn-1.on .tab-num { background:rgba(63,185,80,0.2); color:var(--c1); }
    #btn-2.on { color:var(--c2); border-bottom-color:var(--c2); background:rgba(88,166,255,0.07); }
    #btn-2.on .tab-num { background:rgba(88,166,255,0.2); color:var(--c2); }
    .tab-spacer { flex:1; }
    #clock {
      display:flex; align-items:center;
      font-size:12px; color:var(--text-muted);
      font-variant-numeric:tabular-nums; padding-right:4px;
    }

    /* 탭 패널 */
    .tab-panel { display:none; flex:1; min-height:0; }
    .tab-panel.on { display:flex; }

    /* 히트맵 영역 */
    .heatmap-area { flex:1; display:flex; min-height:0; width:100%; }
    .heatmap-panel {
      flex:1; min-width:0;
      display:flex; flex-direction:column;
      border-right:1px solid var(--border);
    }
    .heatmap-panel:last-child { border-right:none; }
    .panel-title {
      flex-shrink:0; padding:5px 14px;
      font-size:10px; font-weight:700;
      letter-spacing:1.4px; text-transform:uppercase;
      color:var(--text-muted); border-bottom:1px solid var(--border);
      background:var(--bg-card);
    }
    .heatmap-inner { flex:1; min-height:0; position:relative; }

    /* ② iframe 스크롤 허용 */
    .heatmap-inner iframe {
      position:absolute; inset:0;
      width:100%; height:100%;
      border:none; display:block;
      overflow:auto;
    }

    /* 모바일: 상하 분할 */
    @media (max-width: 768px) {
      #panel-1 .heatmap-area { flex-direction: column; }
      #panel-1 .heatmap-panel {
        flex: none; height: 50%;
        border-right: none; border-bottom: 1px solid var(--border);
      }
      #panel-1 .heatmap-panel:last-child { border-bottom: none; }
      .tab-btn { padding: 0 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- 티커 테이프 -->
<div class="ticker-wrap">
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"></script>
  <tv-ticker-tape color-theme="dark"
    symbols="FX_IDC:USDKRW,TVC:DXY,TVC:GOLD,TVC:SILVER,BLACKBULL:WTI,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,THINKMARKETS:NAS100">
  </tv-ticker-tape>
</div>

<!-- 탭 바 -->
<div class="tab-bar">
  <button class="tab-btn on" id="btn-1" onclick="show(1)">
    <span class="tab-num">01</span> KR
  </button>
  <button class="tab-btn" id="btn-2" onclick="show(2)">
    <span class="tab-num">02</span> US
  </button>
  <div class="tab-spacer"></div>
  <div id="clock"></div>
</div>

<!-- KR 탭 -->
<div class="tab-panel on" id="panel-1">
  <div class="heatmap-area">
    <div class="heatmap-panel">
      <div class="panel-title">KOSPI</div>
      <div class="heatmap-inner">
        <!-- ③ KOSPI 탭 자동 선택: hash로 시도 -->
        <iframe
          id="iframe-kospi"
          src="https://prober.kr/product/heatmap/stockKor"
          scrolling="yes"
          allowtransparency="true">
        </iframe>
      </div>
    </div>
    <div class="heatmap-panel">
      <div class="panel-title">KOSDAQ</div>
      <div class="heatmap-inner">
        <iframe
          id="iframe-kosdaq"
          src="https://prober.kr/product/heatmap/stockKor"
          scrolling="yes"
          allowtransparency="true">
        </iframe>
      </div>
    </div>
  </div>
</div>

<!-- US 탭 -->
<div class="tab-panel" id="panel-2">
  <div class="heatmap-area">
    <div class="heatmap-panel">
      <div class="panel-title">S&amp;P 500</div>
      <div class="heatmap-inner">
        <iframe src="spx500.html" scrolling="yes"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
  function show(n) {
    [1,2].forEach(i => {
      document.getElementById('panel-'+i).classList.toggle('on', i===n);
      document.getElementById('btn-'+i).classList.toggle('on', i===n);
    });
    setHeight();
  }

  /* ③ KOSPI/KOSDAQ 탭 자동 클릭 — iframe 로드 후 버튼 클릭 */
  function autoClickMarket(iframeId, market) {
    const iframe = document.getElementById(iframeId);
    iframe.addEventListener('load', function() {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        // KOSPI 또는 KOSDAQ 버튼 찾아서 클릭
        const btns = doc.querySelectorAll('button, [role="tab"], .tab-btn, a');
        btns.forEach(btn => {
          if (btn.textContent.trim() === market) {
            btn.click();
          }
        });
      } catch(e) {
        // cross-origin 제한 시 무시
      }
    });
  }
  autoClickMarket('iframe-kospi', 'KOSPI');
  autoClickMarket('iframe-kosdaq', 'KOSDAQ');

  /* 시계 */
  function tick() {
    const opts = {timeZone:'Asia/Seoul',hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit'};
    document.getElementById('clock').textContent =
      new Date().toLocaleString('ko-KR',opts)+' KST';
  }
  tick(); setInterval(tick,1000);

  /* 높이 */
  function setHeight() {
    const used = document.querySelector('.ticker-wrap').offsetHeight
               + document.querySelector('.tab-bar').offsetHeight;
    const h = Math.max(window.innerHeight-used,300)+'px';
    document.querySelectorAll('.tab-panel,.heatmap-area').forEach(el=>el.style.height=h);
  }
  setHeight();
  window.addEventListener('resize',setHeight);
</script>
</body>
</html>
