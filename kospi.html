<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d1117; }
  iframe { width:100%; height:100%; border:none; display:block; }
  .error { display:none; color:#e6edf3; font-family:sans-serif; padding:40px; text-align:center; }
</style>
</head>
<body>
<iframe
  src="https://markets.hankyung.com/marketmap/kospi"
  scrolling="no"
  allowfullscreen
  onload="this.style.display='block'"
  onerror="document.querySelector('.error').style.display='block'">
</iframe>
<div class="error">한국경제 마켓맵을 불러올 수 없습니다.</div>
</body>
</html>
